<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Nadu Volunteers - ID Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#0c3b23;--card-w:340px;--print-w:60mm}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'Poppins',sans-serif;background:#e9e9e9;padding:24px 16px 60px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toolbar{max-width:1000px;margin:0 auto 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toolbar button{background:var(--green-dark);color:#fff;border:none;padding:11px 20px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer}
.sheet{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.card-pair{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.card{position:relative;width:var(--card-w);aspect-ratio:2/3;background-size:100% 100%;background-repeat:no-repeat;border-radius:10px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.2);container-type:inline-size;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
.card-front{background-image:url('tn-front-bg.png')}.card-back{background-image:url('tn-back-bg.png')}
.ov{position:absolute;white-space:nowrap}.ov-wrap{white-space:normal}.ov-photo{position:absolute;overflow:hidden}.ov-photo img{width:100%;height:100%;object-fit:cover;display:block}
.f-name{left:8.6%;top:58%;transform:translateY(-50%);font-weight:800;color:var(--green-dark);font-size:3.3cqw;max-width:80%}
.f-role{left:8.6%;top:62.2%;transform:translateY(-50%);font-weight:700;color:#c8891c;font-size:1.85cqw;max-width:80%}
.f-idno{left:40.6%;top:66%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.35cqw}
.f-mobile{left:40.6%;top:69.8%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.35cqw}
.f-email{left:40.6%;top:73.3%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.1cqw}
.f-dist{left:40.6%;top:76.9%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.35cqw}
.f-photo-main{left:8.9%;top:38%;width:38.4%;height:15.6%;border-radius:6%}.f-photo-mini{left:52.7%;top:41.3%;width:24.4%;height:9.2%;border-radius:8%}
.b-join{left:57.2%;top:57.8%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.2cqw}.b-valid{left:57.2%;top:60.5%;transform:translateY(-50%);font-weight:600;color:#222;font-size:2.2cqw}
.form{max-width:1000px;margin:0 auto 24px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form h2{grid-column:1/-1;color:var(--green-dark);font-size:18px}.form label{font-size:12px;font-weight:700;color:#333}.form input{width:100%;margin-top:5px;padding:9px 10px;border:1px solid #ccc;border-radius:7px;font:inherit;font-size:13px}
@media print{body{background:#fff;padding:0}.no-print{display:none!important}.sheet{gap:0}.card-pair{page-break-after:always;gap:14px;padding:20px 0}.card{box-shadow:none;width:var(--print-w)}}
</style></head>
<body>
<div class="form no-print">
<h2>ID Card Details</h2>
<label>Name<input id="name"></label><label>Role / Designation<input id="role"></label><label>ID No<input id="idNo"></label>
<label>Mobile No<input id="mobile"></label><label>Email<input id="email"></label><label>District<input id="district"></label>
<label>Joining Date<input id="joiningDate" type="date"></label><label>Photo<input id="photo" type="file" accept="image/*"></label>
</div>
<div class="toolbar no-print"><button id="generate">Generate ID Card</button><button onclick="window.print()">Print / Save as PDF</button></div>
<div class="sheet" id="sheet"></div>
<script>
let currentPhoto='';
const $=id=>document.getElementById(id);
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f){currentPhoto='';return}const r=new FileReader();r.onload=()=>{currentPhoto=r.result;render()};r.readAsDataURL(f)});
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function addYear(s){if(!s)return '';const d=new Date(s+'T00:00:00');d.setFullYear(d.getFullYear()+1);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}
function photoTag(url){return url?`<img src="${url}" alt="Volunteer photo">`:''}
function render(){const v={name:$('name').value,role:$('role').value,idNo:$('idNo').value,mobile:$('mobile').value,email:$('email').value,district:$('district').value,photo:currentPhoto,joiningDate:$('joiningDate').value};
$('sheet').innerHTML=`<div class="card-pair"><div class="card card-front"><div class="ov-photo f-photo-main">${photoTag(v.photo)}</div><div class="ov-photo f-photo-mini">${photoTag(v.photo)}</div><div class="ov ov-wrap f-name">${esc(v.name)}</div><div class="ov ov-wrap f-role">${esc(v.role)}</div><div class="ov f-idno">${esc(v.idNo)}</div><div class="ov f-mobile">${esc(v.mobile)}</div><div class="ov f-email">${esc(v.email)}</div><div class="ov f-dist">${esc(v.district)}</div></div><div class="card card-back"><div class="ov b-join">${fmtDate(v.joiningDate)}</div><div class="ov b-valid">${addYear(v.joiningDate)}</div></div></div>`}
$('generate').addEventListener('click',render);['name','role','idNo','mobile','email','district','joiningDate'].forEach(id=>$(id).addEventListener('input',render));render();
</script></body></html>
